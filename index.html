<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal Planner OS - MultiCalendar & Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* === TEMA SABBIA (Default) === */
  :root{
    --bg: #f4efe6; --card: #ffffff; --card-2: #ebe4d8; --border: #dfd5c5;
    --text: #332f2a; --text-dim: #857d73; --accent: #c59779;
    --accent-soft: rgba(197,151,121,.15); --accent-strong: #b58261;
    --danger: #e53935; --success: #43a047; --radius: 16px; --radius-sm: 10px;
    --c-work: #0288d1; --c-work-soft: rgba(2,136,209,0.1);
    --c-fit: #388e3c; --c-fit-soft: rgba(56,142,60,0.1);
    --c-food: #f57c00; --c-food-soft: rgba(245,124,0,0.1);
    --c-pers: #7b1fa2; --c-pers-soft: rgba(123,31,162,0.1);
    --c-finance: #d84315; --c-finance-soft: rgba(216,67,21,0.12);
  }
  body.theme-space { --bg: #050510; --card: #0c0d1a; --card-2: #121428; --border: #1e2246; --text: #f0f1f3; --text-dim: #7d8392; --accent: #8c9eff; }
  body.theme-cyber { --bg: #000000; --card: #0d0d0d; --card-2: #141414; --border: #262626; --text: #ffffff; --text-dim: #a0a0a0; --accent: #00f0ff; }
  
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh; transition: background 0.4s ease, color 0.4s ease;}
  body { padding:16px; background: radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,0.9), transparent 70%), var(--bg); }
  
  .app{max-width:100%; width:100%; margin:0 auto}
  header.topbar{ display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap; }
  .logo{ width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#c59779,#70523e);display:grid;place-items:center;color:#fff;font-weight:700; }
  .theme-switcher { display: flex; gap: 8px; align-items: center; background: var(--card); padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; }
  .theme-btn { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .main-grid{display:grid;grid-template-columns:1fr 380px;gap:18px; width:100%;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px; width:100%;}
  .day-cell{ background:var(--card-2);border:1px solid var(--border);border-radius:var(--radius-sm);min-height:90px;padding:6px;cursor:pointer; }
  .event-pill{ font-size:10px; padding:3px 6px; border-radius:4px; border-left:2px solid var(--accent); background:var(--accent-soft); color:var(--text); margin-bottom: 2px; }
  .event-pill.finance { border-left: 3px solid var(--c-finance); background: var(--c-finance-soft); }
  .btn{ padding:8px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-weight:500; }
  .btn-primary{background:var(--accent);color:#fff}
  .sidebar-layout { display: flex; flex-direction: column; gap: 18px; }
  .agenda-item { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 8px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
        <div class="logo">Ω</div>
        <h1>Personal Planner OS</h1>
    </div>
    <div class="auth-area">
      <div class="theme-switcher">
        <button class="theme-btn active" id="themeSand" style="background: #e1d3c0;"></button>
        <button class="theme-btn" id="themeSpace" style="background: #5c5c8a;"></button>
        <button class="theme-btn" id="themeCyber" style="background: #00f0ff;"></button>
      </div>
      <button id="loginBtn" class="btn btn-primary">Connetti Account Google</button>
      <div id="userInfo" style="display:none">
        <span id="userEmail"></span>
        <button id="logoutBtn" class="btn">Disconnetti</button>
      </div>
    </div>
  </header>

  <div class="main-grid">
    <section class="card">
        <div id="monthLabel"></div>
        <div class="days-grid" id="daysGrid"></div>
    </section>
    <div class="sidebar-layout">
        <aside class="card">
            <div id="financeItemsContainer"></div>
            <div id="todoItemsContainer"></div>
        </aside>
    </div>
  </div>
</div>

<script>
  const CLIENT_ID = '7642810548-nsn60e5bnkne6fr4nnm8o5o51vtpreaa.apps.googleusercontent.com';
  const SCOPES = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/tasks';
  const CALENDAR_IDS = [
      'primary', 
      '5ate0h4qh44mq1k981fdgqadu8@group.calendar.google.com', 
      'ac2d64da2d27277e9ff28bc76ecb85958dc268709f5ea2bead14e7d190b1a7e5@group.calendar.google.com', 
      'v.sim.driver@gmail.com'
  ];

  let accessToken = null;
  const $ = (id) => document.getElementById(id);

  async function loadAndRenderEvents() {
    if (!accessToken) return;
    let allEvents = [];
    for (const calId of CALENDAR_IDS) {
      try {
        const resp = await gapi.client.calendar.events.list({ calendarId: calId, singleEvents: true, timeMin: new Date().toISOString() });
        allEvents = allEvents.concat(resp.result.items || []);
      } catch(e) { console.warn('Errore cal: ' + calId); }
    }
    events = allEvents;
    renderAll();
  }

  function extractAmount(title) {
    // Legge formati come "€ 1.000,00" o "1.000,00 €"
    const match = title.match(/€\s*([\d\.,]+)|([\d\.,]+)\s*€/);
    if (match) {
      let numStr = (match[1] || match[2]).replace(/\./g, '').replace(',', '.');
      return parseFloat(numStr) || 0;
    }
    return 0;
  }

  // --- Funzioni di caricamento Google (già configurate) ---
  function gapiLoad(){ gapi.load('client', async () => { await gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest','https://www.googleapis.com/discovery/v1/apis/tasks/v1/rest'] }); }); }
  function gisLoad(){ tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: (resp) => { accessToken = resp.access_token; loadAndRenderEvents(); } }); }

  $('loginBtn').onclick = () => tokenClient.requestAccessToken({prompt:'consent'});
</script>
<script src="https://apis.google.com/js/api.js" onload="gapiLoad()"></script>
<script src="https://accounts.google.com/gsi/client" onload="gisLoad()" defer></script>
</body>
</html>
